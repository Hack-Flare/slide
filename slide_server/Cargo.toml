[package]
name = "slide_server"
version = "0.1.0"
edition = "2024"

[dependencies]
include_dir = "0.7"
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
surrealdb = { version = "2.7", default-features = false, features = ["kv-mem"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
